[project]
name = "inf8239-u02-nlp"
version = "0.1.0"
description = "Proyecto reproducible de PLN para INF-8239"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gensim>=4.3,<5",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_u02"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
